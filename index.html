      /* ✅ Priority Badge - compact soft version */
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;

        min-width: 88px;
        padding: 6px 10px;
        border-radius: 999px;

        font-size: 11.5px;
        font-weight: 800;
        letter-spacing: 0.15px;
        text-transform: uppercase;
        white-space: nowrap;

        border: 1px solid rgba(255, 255, 255, 0.1);

        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 2px 5px rgba(0, 0, 0, 0.18);

        backdrop-filter: blur(3px);
      }

      /* Critical - แดงนุ่ม */
      .badge.critical {
        background: linear-gradient(135deg, #7f1d1d, #b91c1c);
        color: #fee2e2;
        border-color: rgba(248, 113, 113, 0.22);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 0 5px rgba(239, 68, 68, 0.18);
      }

      /* Major - ส้มหม่น */
      .badge.major {
        background: linear-gradient(135deg, #78350f, #b45309);
        color: #ffedd5;
        border-color: rgba(251, 191, 36, 0.22);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 0 5px rgba(245, 158, 11, 0.16);
      }

      /* Minor - เขียวนุ่ม */
      .badge.minor {
        background: linear-gradient(135deg, #065f46, #15803d);
        color: #dcfce7;
        border-color: rgba(74, 222, 128, 0.2);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 0 5px rgba(34, 197, 94, 0.14);
      }

      /* None - เทานุ่ม */
      .badge.none {
        background: line*r-gradient(135deg, #1e293b, #47556*);
        color: #e2e8f0;
        border-colo*: rgba(148, 163, 184, 0.18);
        box*shadow:
          inset 0 1px 0 rgba(255* 255, 255, 0.08),
          0 0 4px rgba*148, 163, 184, 0.12);
      }

      /* 🚨 Critical - แดงนุ่ม ไม่บาดตา */
      .badge.critical {
        background: linear-gradient(135deg, #991b1b, #ef4444);
        color: #fee2e2;
        border-color: rgba(248, 113, 113, 0.35);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.12),
          0 0 8px rgba(239, 68, 68, 0.32);
      }

      /* ⚠️ Major - ส้มอบอุ่น */

      function isThailandCoord(lat, lng) {
        return lat >= 5 && lat <= 21 && lng >= 97 && lng <= 106.8;
      }
      function normalizeThaiCoord(a, b) {
        let lat = parseFloat(a),
          lng = parseFloat(b);
        if (isNaN(lat) || isNaN(lng)) return null;
        if (isThailandCoord(lat, lng)) return { lat, lng };
        if (isThailandCoord(lng, lat)) return { lat: lng, lng: lat };
        return null;
      }
      function isThailandCoord(lat, lng) {
        return lat >= 5 && lat <= 21 && lng >= 97 && lng <= 106.8;
      }

      function normalizeThaiCoord(a, b) {
        let lat = parseFloat(a);
        let lng = parseFloat(b);

        if (isNaN(lat) || isNaN(lng)) return null;

        // ปกติ lat,lng
        if (isThailandCoord(lat, lng)) {
          return { lat, lng };
        }

        // กรณีใส่สลับ lng,lat
        if (isThailandCoord(lng, lat)) {
          return {
            lat: lng,
            lng: lat,

        function offsetMarkerCoord(lat, lng, index, total) {
          if (total <= 1) {
            return [lat, lng];
          }

          let radiusMeters = total <= 3 ? 35 : total <= 6 ? 50 : 70;

          let angle = (2 * Math.PI * index) / total;

          let earth = 6378137;

          let dLat = (radiusMeters * Math.cos(angle)) / earth;

          let dLng =
            (radiusMeters * Math.sin(angle)) /
            (earth * Math.cos((Math.PI * lat) / 180));

          let newLat = lat + (dLat * 180) / Math.PI;

          let newLng = lng + (dLng * 180) / Math.PI;

          return [newLat, newLng];
        }
        async function buildAIMapMarkers() {
          let groups = {};

          for (const job of jobs) {
            let title = job['Job Title'] || '';

            let province = job['Province Name'] || '';

            let district = job['District Name'] || '';

            let coord = await getJobCoord(job);

            if (!coord) {
              console.warn('No coordinate:', job['Job ID'], province, district);

              continue;
            }

            let lat = coord[0];
            let lng = coord[1];

            let gps = extractGPS(title);

            let useGpsKey = gps && isSameCoord(coord, gps);

            let key = '';

            if (useGpsKey) {
              key = `GPS|${lat.toFixed(5)}|${lng.toFixed(5)}`;
            } else {
              key = `AREA|${province}|${district}`;
            }

            if (!groups[key]) {
              groups[key] = {
                lat,
                lng,
                jobs: [],
                source: useGpsKey ? 'GPS_TITLE' : 'AREA_COORD',
              };
            }

            groups[key].jobs.push(job);
          }

          let groupList = Object.values(groups);

          let buckets = {};

          groupList.forEach((group) => {
            let key = group.lat.toFixed(5) + '|' + group.lng.toFixed(5);

            if (!buckets[key]) {
              buckets[key] = [];
            }

            buckets[key].push(group);
          });

          Object.values(buckets).forEach((bucket) => {
            bucket.forEach((group, idx) => {
              group._offsetIndex = idx;
              group._offsetTotal = bucket.length;
            });
          });

          groupList.forEach((group) => {
            let mainJob = getHighestPriorityJob(group.jobs);

            let displayCoord = offsetMarkerCoord(
              group.lat,
              group.lng,
              group._offsetIndex || 0,
              group._offsetTotal || 1
            );

            let marker = w.L.marker(displayCoord, {
              icon: makeMapIcon(mainJob),
            })
              .addTo(aiMap)
              .bindPopup(buildMapPopup(group));

        async function getJobCoord(job) {

          let gps = extractGPS(title);

          let district = job['District Name'] || '';

          let areaCoord = getAreaCoord(province, district);

          if (!areaCoord) {
            areaCoord = await geocodeArea(province, district);
          }

          if (
            gps &&
            areaCoord &&
            distanceKm(gps.lat, gps.lng, areaCoord[0], areaCoord[1]) <= 35
          ) {
            return [gps.lat, gps.lng];
          }

          if (areaCoord) {

          }

          return null;
        }

        function getLatestOnsiteJob() {

          let onsites = jobs
            .filter((job) => {
              let s = (job['Status'] || '').toLowerCase();

              let assign = (job['Assign to'] || '').toLowerCase().trim();

              let isOnsite = s.includes('on-site') || s.includes('onsite');

              if (!isOnsite) return false;

              if (selected && assign !== selected) return false;

              return true;
            })
            .sort(

        async function buildSmartRouteJobs() {
          let startJob = getLatestOnsiteJob();

          if (!startJob) {
            alert('ไม่พบ Job สถานะ On-site สำหรับใช้เป็นจุดเริ่มต้น');
            return [];
          }

          let startCoord = await getJobCoord(startJob);

          if (!startCoord) {
            alert('ไม่พบพิกัดของ Job On-site ล่าสุด');
            return [];
          }

          let candidates = [];

          for (const job of jobs) {
            if (job['Job ID'] === startJob['Job ID']) {
              continue;
            }

            let selected = (w.selectedEngineer || '').toLowerCase().trim();

            let assign = (job['Assign to'] || '').toLowerCase().trim();

            if (selected && assign !== selected) {
              continue;
            }

            let status = (job['Status'] || '').toLowerCase();

            if (status.includes('done') || status.includes('cancel')) {
              continue;
            }

            let coord = await getJobCoord(job);

            if (!coord) continue;

            let pr = (job['Priority'] || 'NONE').toUpperCase();

            let remain = job.limit - getHr(job['Create Time']);

            let dist = distanceKm(
              startCoord[0],
              startCoord[1],
              coord[0],
              coord[1]
            );

            let priorityScore =
              pr === 'CRITICAL'
                ? 1000
                : pr === 'MAJOR'
                ? 600
                : pr === 'MINOR'
                ? 300
                : 100;

            let overdueScore = job.overdue > 0 ? 800 : 0;

            let slaScore = remain <= 2 ? 300 : remain <= 4 ? 150 : 0;

            let distanceScore = Math.max(0, 200 - dist);

            let score = priorityScore + overdueScore + slaScore + distanceScore;

            candidates.push({
              job,
              coord,
              score,
              dist,
            });
          }

          candidates.sort((a, b) => b.score - a.score);

          let selectedJobs = candidates.slice(0, 4);

          return [
            {
              job: startJob,
              coord: startCoord,
              start: true,
            },
            ...selectedJobs,
          ];
        }

      }

      function closeToolsMenu() {
        let menu = document.getElementById('toolsMenu');

        if (!menu) return;

        menu.classList.remove('show');
      }

      document.addEventListener('click', function (e) {
        let wrap = document.querySelector('.tools-wrap');

        if (!wrap) return;

        if (!wrap.contains(e.target)) {
          closeToolsMenu();
        }
      });
      function initToolDefaultAll() {
        let allWorkButtons = document.querySelectorAll(
          '.mode-tool[data-group="work"]:not([data-value="all"])'
        );

        let allStatusButtons = document.querySelectorAll(
          '.mode-tool[data-group="status"]:not([data-value="all"])'
        );

        workSubFilters = Array.from(allWorkButtons).map((b) => b.dataset.value);

        statusSubFilters = Array.from(allStatusButtons).map(
          (b) => b.dataset.value
        );

        // Work + Status ถูกเลือกพร้อมกัน = Both
        viewMode = 2;

        updateToolsActiveState();

        render();
      }
      function toggleToolMultiFilter(type, value, mode, btn) {
        if (type === 'work') {
          if (value === 'all') {
            let allWorkButtons = document.querySelectorAll(
              '.mode-tool[data-group="work"]:not([data-value="all"])'
            );

            let allValues = Array.from(allWorkButtons).map(
              (b) => b.dataset.value
            );

            let isAllSelected =
              allValues.length > 0 &&
              allValues.every((v) => workSubFilters.includes(v));

            workSubFilters = isAllSelected ? [] : allValues;
          } else {
            if (workSubFilters.includes(value)) {
              workSubFilters = workSubFilters.filter((v) => v !== value);
            } else {
              workSubFilters.push(value);
            }
          }
        }

        if (type === 'status') {
          if (value === 'all') {
            let allStatusButtons = document.querySelectorAll(
              '.mode-tool[data-group="status"]:not([data-value="all"])'
            );

            let allValues = Array.from(allStatusButtons).map(
              (b) => b.dataset.value
            );

            let isAllSelected =
              allValues.length > 0 &&
              allValues.every((v) => statusSubFilters.includes(v));

            statusSubFilters = isAllSelected ? [] : allValues;
          } else {
            if (statusSubFilters.includes(value)) {
              statusSubFilters = statusSubFilters.filter((v) => v !== value);
            } else {
              statusSubFilters.push(value);
            }
          }
        }

        // Auto Mode
        if (workSubFilters.length > 0 && statusSubFilters.length > 0) {
          viewMode = 2; // Both
        } else if (statusSubFilters.length > 0) {
          viewMode = 1; // Status
        } else {
          viewMode = 0; // Work
        }

        updateToolsActiveState();

        render();
      }
      function updateToolsActiveState() {
        document.querySelectorAll('.mode-tool').forEach((btn) => {
          let group = btn.dataset.group;

          let value = btn.dataset.value;

          btn.classList.remove('active');

          if (group === 'work') {
            if (value === 'all') {
              let allWorkButtons = document.querySelectorAll(
                '.mode-tool[data-group="work"]:not([data-value="all"])'
              );

              let allValues = Array.from(allWorkButtons).map(
                (b) => b.dataset.value
              );

              if (
                allValues.length > 0 &&
                allValues.every((v) => workSubFilters.includes(v))
              ) {
                btn.classList.add('active');
              }
            } else if (workSubFilters.includes(value)) {
              btn.classList.add('active');
            }
          }

          if (group === 'status') {
            if (value === 'all') {
              let allStatusButtons = document.querySelectorAll(
                '.mode-tool[data-group="status"]:not([data-value="all"])'
              );

              let allValues = Array.from(allStatusButtons).map(
                (b) => b.dataset.value
              );

              if (
                allValues.length > 0 &&
                allValues.every((v) => statusSubFilters.includes(v))
              ) {
                btn.classList.add('active');
              }
            } else if (statusSubFilters.includes(value)) {
              btn.classList.add('active');
            }
          }
        });
      }

      function passToolSubFilter(r) {
        let title = r['Job Title'] || '';

        let status = (r['Status'] || '').toLowerCase();

        let work = getWorkType(title).text;

        let allWorkButtons = document.querySelectorAll(
          '.mode-tool[data-group="work"]:not([data-value="all"])'
        );

        let allWorkValues = Array.from(allWorkButtons).map(
          (b) => b.dataset.value
        );

        let allStatusButtons = document.querySelectorAll(
          '.mode-tool[data-group="status"]:not([data-value="all"])'
        );

        let allStatusValues = Array.from(allStatusButtons).map(
          (b) => b.dataset.value
        );

        let isAllWorkSelected =
          allWorkValues.length > 0 &&
          allWorkValues.every((v) => workSubFilters.includes(v));

        let isAllStatusSelected =
          allStatusValues.length > 0 &&
          allStatusValues.every((v) => statusSubFilters.includes(v));

        // Work filter
        // ถ้า All Work ถูกเลือกครบ = ไม่กรอง Work
        if (workSubFilters.length > 0 && !isAllWorkSelected) {
          if (!workSubFilters.includes(work)) {
            return false;
          }
        }

        // Status filter
        // ถ้า All Status ถูกเลือกครบ = ไม่กรอง Status
        if (statusSubFilters.length > 0 && !isAllStatusSelected) {
          let matchedStatus = statusSubFilters.some((filter) => {
            if (filter === 'on-site') {
              return status.includes('on-site') || status.includes('onsite');
            }

            return status.includes(filter);
          });

          if (!matchedStatus) {
            return false;
          }
        }

        return true;
      }
      function render() {
        let prov = $('#provinceFilter').val();
        let map = {},
          c = 0,
          m = 0,
          n = 0,
          o = 0;
        data.forEach((r) => {
          let pr = (mapCol(r, ['Priority']) || 'NONE').toUpperCase();
          let p = mapCol(r, ['Province Name']);
          let job = (mapCol(r, ['Job ID']) || '').toLowerCase();
          let title = (mapCol(r, ['Job Title']) || '').toLowerCase();
          let status = (mapCol(r, ['Status']) || '').toLowerCase();
          let assign = (mapCol(r, ['Assign to']) || '').toLowerCase();
          let province = (mapCol(r, ['Province Name']) || '').toLowerCase();
          let district = (mapCol(r, ['District Name']) || '').toLowerCase();
          let work = getWorkType(title).text.toLowerCase();
          let hr = getHr(r['Create Time']);
          let limit = pr === 'CRITICAL' ? 3 : pr === 'MAJOR' ? 10 : 1000;
          let od = hr > limit;
          let k = $('#search').val().toLowerCase().trim();
          let keys = k ? k.split(/\s+/) : [];
          let code = (PROV_CODE[p] || '').toLowerCase();
          let text =
            job +
            ' ' +
            title +
            ' ' +
            status +
            ' ' +
            assign +
            ' ' +
            province +
            ' ' +
            district +
            ' ' +
            work +
            ' ' +
            code;
          if (od) text += ' overdue';
          for (let key of keys) {
            if (key === 'overdue' && !od) return;
            if (key !== 'overdue' && !text.includes(key)) return;
          }
          if (prov && p !== prov) return;
          if (!passToolSubFilter(r)) return;
          if (pr === 'CRITICAL') c++;
          else if (pr === 'MAJOR') m++;
          else n++;
          if (od) o++;
          if (!pass(pr, od)) return;
          if (!map[p]) map[p] = [];
          map[p].push({
            ...r,
            pr,
            hr,
            limit,
            od,
            district: r['District Name'],
            status: r['Status'],
            assign: r['Assign to'] || '-',
            work: getWorkType(title),
          });
        });
        $('#c').text('Critical:' + c);
        $('#m').text('Major:' + m);
        $('#n').text('Minor:' + n);
        $('#t').text('Total:' + (c + m + n));
        $('#o').text('Overdue:' + o);
        root.innerHTML =
          Object.keys(map)
            .map(
              (p) =>
                `<div class="card" id="${p}"><div class="card-header"><h3>📍 ${
                  PROV_CODE[p] ? `(${PROV_CODE[p]}) ` : ''
                }${p}</h3><button class="btn-export" onclick="exportJPG('${p}')"><span>📸</span><span>Export</span></button></div><table><tr><th>Job</th><th>Priority</th><th>Create</th><th>Work / Status</th><th>Title</th><th>Province</th><th>Assign</th><th>สถานะ SLA</th></tr>${map[
                  p
                ]
                  .map(
                    (r) =>
                      `<tr class="${r.od ? 'overdue' : ''}"><td>${
                        r['Job ID'] || ''
                      }</td><td><div class="badge ${r.pr.toLowerCase()}">${
                        r.pr
                      }</div></td><td>${
                        r['Create Time'] || ''
                      }</td><td><div class="work work-${
                        r.work.type
                      }" style="display:${
                        viewMode === 0 || viewMode === 2
                          ? 'inline-flex'
                          : 'none'
                      }">${r.work.icon} ${
                        r.work.text
                      }</div><div class="status-badge status-${
                        getStatusInfo(r.status).cls
                      }" style="display:${
                        viewMode === 1 || viewMode === 2
                          ? 'inline-flex'
                          : 'none'
                      }">${getStatusInfo(r.status).icon} ${
                        getStatusInfo(r.status).text
                      }</div></td><td class="title-cell"><div class="title-text">${
                        r['Job Title'] || ''
                      }</div><span class="remark-btn ${
                        r['Reason by WF'] ? 'has-remark' : ''
                      }" onclick="showRemark('${
                        r['Job ID']
                      }')">ℹ️</span></td><td><div class="prov-name">${p}</div><div class="dist">${
                        r.district || ''
                      }</div></td><td><div class="assign-box">${
                        r.assign
                      }<td>${(() => {
                        let s = getSLA(r.hr, r.limit);

                        let remainText = r.od
                          ? '<span class="sla-overdue-text">🔥 เกิน SLA 🔥</span>'
                          : 'เหลือ: ' + formatTime(r.limit - r.hr);

                        return `
    <div class="sla-box">
      <div class="sla-bar">
        <div class="sla-fill ${r.od ? 'sla-red' : s.color}" style="width:${
                          s.pct
                        }%"></div>
        <div class="sla-percent">${s.pct.toFixed(0)}%</div>
      </div>
      <div class="sla-text">ใช้ไป: ${formatTime(r.hr)}</div>
      <div class="sla-text">${remainText}</div>
    </div>
  `;
                      })()}</td>
</tr>`
                  )
                  .join('')}</table></div>`
            )
            .join('') || '<div class="no-data">❌ ไม่พบข้อมูล</div>';
      }
    </script>
  </body>
</html>
