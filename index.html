      /* ✅ Priority Badge - compact soft version */
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;

        min-width: 88px;
        padding: 6px 10px;
        border-radius: 999px;

        font-size: 11.5px;
        font-weight: 800;
        letter-spacing: 0.15px;
        text-transform: uppercase;
        white-space: nowrap;

        border: 1px solid rgba(255, 255, 255, 0.1);

        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 2px 5px rgba(0, 0, 0, 0.18);

        backdrop-filter: blur(3px);
      }

      /* Critical - แดงนุ่ม */
      .badge.critical {
        background: linear-gradient(135deg, #7f1d1d, #b91c1c);
        color: #fee2e2;
        border-color: rgba(248, 113, 113, 0.22);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 0 5px rgba(239, 68, 68, 0.18);
      }

      /* Major - ส้มหม่น */
      .badge.major {
        background: linear-gradient(135deg, #78350f, #b45309);
        color: #ffedd5;
        border-color: rgba(251, 191, 36, 0.22);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 0 5px rgba(245, 158, 11, 0.16);
      }

      /* Minor - เขียวนุ่ม */
      .badge.minor {
        background: linear-gradient(135deg, #065f46, #15803d);
        color: #dcfce7;
        border-color: rgba(74, 222, 128, 0.2);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 0 5px rgba(34, 197, 94, 0.14);
      }

      /* 🚨 Critical - แดงนุ่ม ไม่บาดตา */
      .badge.critical {
        background: linear-gradient(135deg, #991b1b, #ef4444);
        color: #fee2e2;
        border-color: rgba(248, 113, 113, 0.35);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12),
          0 0 8px rgba(239, 68, 68, 0.32);
      }

      /* ⚠️ Major - ส้มอบอุ่น */
      .badge.major {
        background: linear-gradient(135deg, #92400e, #f59e0b);
        color: #fff7ed;
        border-color: rgba(251, 191, 36, 0.35);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14),
          0 0 8px rgba(245, 158, 11, 0.28);
      }

      /* 🟢 Minor - เขียวนุ่ม */
      .badge.minor {

  try {

    }

    let json = JSON.parse(text);

    if (!json.ok) {
      console.error('siteCoords not ok:', json);
      return false;
    }

    SITE_COORD = json.siteCoords || {};

    if (SITE_COORD && Object.keys(SITE_COORD).length > 0) {
      localStorage.setItem('siteCoordsCache', JSON.stringify(SITE_COORD));
    }

    buildSiteCoordIndex();

    console.log('SITE_COORD LOADED:', {
      siteCoordCount: Object.keys(SITE_COORD || {}).length,
      siteIndexCount: Object.keys(SITE_COORD_INDEX || {}).length,
      test3702087: SITE_COORD_INDEX[normalizeSiteCodeKey('3702_087')]
    });

    return true;
  } catch (err) {
    console.error('LOAD SITE COORDS ERROR:', err);
    return false;
  }
}
function normalizeSiteCodeKey(v) {
  let parts =
    String(v || '')
      .toUpperCase()
      .match(/[A-Z]*\d+[A-Z]*|[A-Z]+/g) || [];

  parts = parts
    .map((p) => {
      if (/^\d+$/.test(p)) {
        return String(Number(p));
      }

      if (/^0+\d+[A-Z]+$/.test(p)) {
        return p.replace(/^0+(?=\d)/, '');
      }

      return p;
    })
    .filter(Boolean);

  return parts.join('|');
}
function buildSiteCoordIndex() {
  SITE_COORD_INDEX = {};

  const source = SITE_COORD || {};
  const keys = Object.keys(source);

  keys.forEach((key) => {
    const item = source[key];

    if (!item) return;

    if (
      item.lat === undefined ||
      item.lng === undefined ||
      item.lat === '' ||
      item.lng === ''
    ) {
      return;
    }

    const lat = Number(item.lat);
    const lng = Number(item.lng);

    if (Number.isNaN(lat) || Number.isNaN(lng)) {
      return;
    }

    const norm = normalizeSiteCodeKey(key);

    if (!norm) return;

    if (SITE_COORD_INDEX[norm]) {
      console.warn('Duplicate normalized site key:', {
        norm,
        oldKey: SITE_COORD_INDEX[norm].key,
        newKey: key
      });
    }

    SITE_COORD_INDEX[norm] = {
      key: key,
      lat: lat,
      lng: lng,
      type: item.type || '',
      address: item.address || ''
    };
  });

  console.log('SITE_COORD_INDEX READY:', Object.keys(SITE_COORD_INDEX).length);
}

function formatMobileDisplay(v) {
  let s = String(v || '').trim();

  let dashed = s.match(/0\d{2}-\d{7}/);

  if (dashed) {
    return dashed[0];
  }

  let digits = s.replace(/[^\d]/g, '');

  let match = digits.match(/0\d{9}/);

  if (!match) {
    return '-';
  }

  let number = match[0];

  return number.replace(/^(\d{3})(\d{7})$/, '$1-$2');
}

        let hasGpsKeyword = /gps|coord|coordinate|พิกัด|lat|lon|lng/i.test(

        let m = title.match(
          /lat[:= ]\s*(-?\d{1,2}\.\d+).*?(lon|lng)[:= ]\s*(-?\d{1,3}\.\d+)/i
        );

        }

        let re = /(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/g;

        while ((m = re.exec(title)) !== null) {

          if (m[8].toUpperCase() === 'W') lng *= -1;

          );
        });

          return DISTRICT_COORD[matchedKey];
        }

        if (PROVINCE_COORD_REMOTE && PROVINCE_COORD_REMOTE[p]) {
          return PROVINCE_COORD_REMOTE[p];

        if (typeof PROVINCE_COORD !== 'undefined' && PROVINCE_COORD[p]) {

      async function geocodeArea(province, district) {
        if (!province || !district) {
          return null;
        }

        let key = `${province}|${district}`;

        if (DISTRICT_COORD && DISTRICT_COORD[key]) {
          return DISTRICT_COORD[key];
        }

        let url =
          APPS_SCRIPT_URL +
          '?action=geocode' +
          '&province=' +
          encodeURIComponent(province) +
          '&district=' +
          encodeURIComponent(district);

        try {
          let res = await fetch(url);

          let json = await res.json();

          if (json.ok && json.result && json.result.lat && json.result.lng) {
            let coord = [json.result.lat, json.result.lng];

            DISTRICT_COORD[key] = coord;

            return coord;
          }
        } catch (err) {
          console.warn('Geocode failed:', province, district, err);
        }

        return null;
      }

function formatRouteLabelJobId(jobId) {
  let s = String(jobId || '').trim();

  if (!s) {
    return '-';
  }

  let m = s.match(/^JB\d+-(.+)$/i);

  if (m && m[1]) {
    return 'JB' + m[1];
  }

  if (s.length > 12) {
    return s.slice(0, 4) + '…' + s.slice(-6);
  }

  return s;
}

function getRouteSimPointJobId(point, pointNo) {
  let meta = point && point.meta ? point.meta : {};

  if (
    meta.jobs &&
    meta.jobs.length > 0 &&
    meta.jobs[0] &&
    meta.jobs[0]['Job ID']
  ) {
    return meta.jobs[0]['Job ID'];
  }

  if (meta.job && meta.job['Job ID']) {
    return meta.job['Job ID'];
  }

  if (meta.name) {
    return String(meta.name).split('|')[0].trim();
  }

  return 'จุด ' + pointNo;
}

        async function getRoadRouteFromOSRM(points) {
          if (!points || points.length < 2) {
            return null;
          }

          const coords = points.map((p) => `${p[1]},${p[0]}`).join(';');

          const url =
            `https://router.project-osrm.org/route/v1/driving/${coords}` +
            `?overview=full&geometries=geojson&steps=false`;

          const res = await fetch(url);

          const json = await res.json();

          if (
            !json ||
            json.code !== 'Ok' ||
            !json.routes ||
            !json.routes.length
          ) {
            console.warn('OSRM route failed:', json);
            return null;
          }

          const route = json.routes[0];

          const latlngs = route.geometry.coordinates.map((c) => [c[1], c[0]]);

          let legs = (route.legs || []).map((leg, index) => {
  return {
    index: index,
    from: index + 1,
    to: index + 2,
    distanceKm: leg.distance / 1000,
    durationMin: leg.duration / 60
  };
});

return {
  latlngs: latlngs,
  distanceKm: route.distance / 1000,
  durationMin: route.duration / 60,
  legs: legs
};
        }

        function getPriorityRank(job) {
          let pr = (job['Priority'] || 'NONE').toUpperCase();

          if (pr === 'CRITICAL') return 1;

          if (pr === 'MAJOR') return 2;

          if (pr === 'MINOR') return 3;

          return 4;
        }

        function getHighestPriorityJob(jobs) {
          return [...jobs].sort(
            (a, b) => getPriorityRank(a) - getPriorityRank(b)
          )[0];
        }

        function offsetMarkerCoord(lat, lng, index, total) {
          if (total <= 1) {
            return [lat, lng];
          }

          let radiusMeters = total <= 3 ? 35 : total <= 6 ? 50 : 70;

          let angle = (2 * Math.PI * index) / total;

          let earth = 6378137;

          let dLat = (radiusMeters * Math.cos(angle)) / earth;

          let dLng =
            (radiusMeters * Math.sin(angle)) /
            (earth * Math.cos((Math.PI * lat) / 180));

          let newLat = lat + (dLat * 180) / Math.PI;

          let newLng = lng + (dLng * 180) / Math.PI;

          return [newLat, newLng];
        }

      createTime: job['Create Time'] || '',

    };

  let box = w.document.getElementById(dropdownId);

  if (!box) return;

  let willOpen = !box.classList.contains('show');

  w.document.querySelectorAll('.engineer-route-dd').forEach((item) => {
    item.classList.remove('show');
  });

  if (willOpen) {

    if (input) {
      input.value = '';
      w.filterEngineerRouteDropdown(dropdownId, '');

      setTimeout(() => {

      }, 50);
    }
  }
};

w.filterEngineerRouteDropdown = function (dropdownId, keyword) {
  let box = w.document.getElementById(dropdownId);

  if (!box) return;

  let q = String(keyword || '').toLowerCase().trim();

  box.querySelectorAll('.engineer-route-dd-item').forEach((item) => {
    let text = String(item.textContent || '').toLowerCase();

    item.style.display = !q || text.includes(q) ? '' : 'none';

w.closeEngineerRouteDropdowns = function () {

  });

w.bindEngineerRouteDropdownItems = function (listId, labelId, mode) {
  let list = w.document.getElementById(listId);
  let label = w.document.getElementById(labelId);

  if (!list) return;

  list.querySelectorAll('.engineer-route-dd-item').forEach((item) => {
    item.onclick = function (event) {
      event.preventDefault();
      event.stopPropagation();

      let value = item.dataset.value || '';
      let text = item.dataset.label || item.textContent || '';

      if (label) {
        label.textContent = text;
      }

      w.closeEngineerRouteDropdowns();

function normalizeSiteSearchText(v) {
  let tokens =
    String(v || '')
      .toUpperCase()
      .match(/[A-Zก-๙]*\d+[A-Zก-๙]*|[A-Zก-๙]+/g) || [];

  tokens = tokens
    .map((t) => {
      // 087 -> 87
      if (/^\d+$/.test(t)) {
        return String(Number(t));
      }

      // 01HW -> 1HW
      if (/^0+\d+[A-Zก-๙]+$/.test(t)) {
        return t.replace(/^0+(?=\d)/, '');
      }

      return t;
    })
    .filter(Boolean);

  return '|' + tokens.join('|') + '|';
}

function getLatestDepartedJobsByEngineer() {
  let map = {};

  jobs.forEach((job) => {
    let status = String(job['Status'] || '').toLowerCase();
    let assign = String(job['Assign to'] || '').trim();

    let isDeparted = status.includes('departed');

    if (!isDeparted || !assign) {
      return;
    }

    let key = assign.toLowerCase();

    if (!map[key]) {
      map[key] = job;
      return;
    }

    let oldTime = new Date(map[key]['Create Time'] || 0);
    let newTime = new Date(job['Create Time'] || 0);

    if (newTime > oldTime) {
      map[key] = job;
    }
  });

  return map;
}

function findSiteCoordFromTitle(title) {
  if (!title || !SITE_COORD) {
    return null;
  }

  let text = String(title || '').toUpperCase();

  let candidates = [];

  // ✅ จับ site code แบบ 3702_087 / 3702-087 / 3702_87 / 3702-87
  let re = /\b\d{4}[_-]\d{2,3}\b/g;
  let m;

  while ((m = re.exec(text)) !== null) {
    candidates.push({
      raw: m[0],
      pos: m.index,
      norm: normalizeSiteCodeKey(m[0])
    });
  }

  // ✅ จับกรณีอยู่ในชื่อ NE เช่น NE_WCO_3702_087_...
  let re2 = /(?:NE|ME|OLT|OX|AN|HCU|WCO|WAC)?[_-]*[A-Z]*[_-]*(\d{4}[_-]\d{2,3})/g;

  while ((m = re2.exec(text)) !== null) {
    candidates.push({
      raw: m[1],
      pos: m.index,
      norm: normalizeSiteCodeKey(m[1])
    });
  }

  // เรียงตามตำแหน่งที่เจอใน Title
  candidates.sort((a, b) => a.pos - b.pos);

  for (const c of candidates) {
    let item = SITE_COORD_INDEX[c.norm];

    if (item) {
      return {
        key: item.key,
        lat: item.lat,
        lng: item.lng,
        type: item.type || '',
        address: item.address || ''
      };
    }
  }

  // fallback แบบ scan ทุก key เผื่อ code รูปแบบพิเศษ
  const titleNorm = normalizeSiteSearchText(title);

  let bestMatch = null;

  Object.keys(SITE_COORD || {}).forEach((key) => {
    let keyNorm = normalizeSiteSearchText(key);

    if (!keyNorm || keyNorm === '||') return;

    let pos = titleNorm.indexOf(keyNorm);

    if (pos === -1) return;

    let item = SITE_COORD[key];

    if (
      !item ||
      isNaN(Number(item.lat)) ||
      isNaN(Number(item.lng))
    ) {
      return;
    }

    let candidate = {
      key: key,
      lat: Number(item.lat),
      lng: Number(item.lng),
      type: item.type || '',
      address: item.address || '',
      pos: pos,
      keyLength: keyNorm.length
    };

    if (
      !bestMatch ||
      candidate.pos < bestMatch.pos ||
      (
        candidate.pos === bestMatch.pos &&
        candidate.keyLength > bestMatch.keyLength
      )
    ) {
      bestMatch = candidate;
    }
  });

  if (!bestMatch) {
    return null;
  }

  return {
    key: bestMatch.key,
    lat: bestMatch.lat,
    lng: bestMatch.lng,
    type: bestMatch.type,
    address: bestMatch.address
  };
}

        function getLatestOnsiteJob() {
          let selected = (w.selectedEngineer || '').toLowerCase().trim();

          let onsites = jobs
            .filter((job) => {
              let s = (job['Status'] || '').toLowerCase();

              let assign = (job['Assign to'] || '').toLowerCase().trim();

              let isOnsite = s.includes('on-site') || s.includes('onsite');

              if (!isOnsite) return false;

              if (selected && assign !== selected) return false;

              return true;
            })
            .sort(
              (a, b) => new Date(b['Create Time']) - new Date(a['Create Time'])
            );

          return onsites[0] || null;
        }

        async function buildSmartRouteJobs() {
          let startJob = getLatestOnsiteJob();

          if (!startJob) {
            alert('ไม่พบ Job สถานะ On-site สำหรับใช้เป็นจุดเริ่มต้น');
            return [];
          }

          let startCoord = await getJobCoord(startJob);

          if (!startCoord) {
            alert('ไม่พบพิกัดของ Job On-site ล่าสุด');
            return [];
          }

          let candidates = [];

          for (const job of jobs) {
            if (job['Job ID'] === startJob['Job ID']) {
              continue;
            }

            let selected = (w.selectedEngineer || '').toLowerCase().trim();

            let assign = (job['Assign to'] || '').toLowerCase().trim();

            if (selected && assign !== selected) {
              continue;
            }

            let status = (job['Status'] || '').toLowerCase();

            if (status.includes('done') || status.includes('cancel')) {
              continue;
            }

            let coord = await getJobCoord(job);

            if (!coord) continue;

            let pr = (job['Priority'] || 'NONE').toUpperCase();

            let remain = job.limit - getHr(job['Create Time']);

            let dist = distanceKm(
              startCoord[0],
              startCoord[1],
              coord[0],
              coord[1]
            );

            let priorityScore =
              pr === 'CRITICAL'
                ? 1000
                : pr === 'MAJOR'
                ? 600
                : pr === 'MINOR'
                ? 300
                : 100;

            let overdueScore = job.overdue > 0 ? 800 : 0;

            let slaScore = remain <= 2 ? 300 : remain <= 4 ? 150 : 0;

            let distanceScore = Math.max(0, 200 - dist);

            let score = priorityScore + overdueScore + slaScore + distanceScore;

            candidates.push({
              job,
              coord,
              score,
              dist,
            });
          }

          candidates.sort((a, b) => b.score - a.score);

          let selectedJobs = candidates.slice(0, 4);

          return [
            {
              job: startJob,
              coord: startCoord,
              start: true,
            },
            ...selectedJobs,
          ];
        }

function normalizeTopSearchText(v) {
  return String(v || '')
    .toLowerCase()
    .replace(/\s+/g, '')
    .trim();
}

function getTopSearchKeywords(q) {
  let raw = String(q || '').trim();

  if (!raw) {
    return [];
  }

  let key = raw.toUpperCase();

  if (!TOP_SEARCH_GROUP_MAP[key]) {
    return [raw];
  }

  let result = [];

  TOP_SEARCH_GROUP_MAP[key].forEach((code) => {
    let aliases = LOCAL_CODE_NAME_MAP[code] || [code];

    aliases.forEach((x) => {
      result.push(x);
    });
  });

  return result;
}

function matchTopSearch(row, q) {
  let keywords = getTopSearchKeywords(q);

  if (!keywords.length) {
    return true;
  }

  let rowText = Object.values(row || {})
    .join(' ')
    .toLowerCase();

  return keywords.some((kw) => {
    return rowText.includes(String(kw || '').toLowerCase());
  });
}


function escapeHtmlAttr(v) {
  return String(v || '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

        if (

          allValues.every((v) => workSubFilters.includes(v))
        ) {
          btn.classList.add('active');
        }
      } else if (workSubFilters.includes(value)) {
        btn.classList.add('active');
      }
    }

    if (group === 'status') {
      if (value === 'all') {
        let allStatusButtons = document.querySelectorAll(
          '.mode-tool[data-group="status"]:not([data-value="all"])'
        );

        let allValues = Array.from(allStatusButtons).map(
          (b) => b.dataset.value
        );

        if (
          allValues.length > 0 &&
          allValues.every((v) => statusSubFilters.includes(v))
        ) {
          btn.classList.add('active');
        }
      } else if (statusSubFilters.includes(value)) {
        btn.classList.add('active');
      }
    }

    if (group === 'network') {
      if (value === 'all') {
        let allNetworkButtons = document.querySelectorAll(
          '.mode-tool[data-group="network"]:not([data-value="all"])'
        );

        let allValues = Array.from(allNetworkButtons).map(
          (b) => b.dataset.value
        );

        if (
          allValues.length > 0 &&
          allValues.every((v) => networkGroupSubFilters.includes(v))
        ) {
          btn.classList.add('active');
        }
      } else if (networkGroupSubFilters.includes(value)) {
        btn.classList.add('active');
      }
    }
  });
}
      function getStatusFilterKey(status) {
        let s = String(status || '')
          .toLowerCase()
          .trim();

        if (s.includes('transfer')) return 'transfer';
        if (s.includes('cancel')) return 'cancel';
        if (s.includes('held')) return 'held';
        if (s.includes('accepted')) return 'accepted';
        if (s.includes('departed')) return 'departed';
        if (s.includes('on-site') || s.includes('onsite')) return 'on-site';
        if (s.includes('assigned')) return 'assigned';
        if (s.includes('done')) return 'done';

        return 'created';
      }
      function passToolSubFilter(r) {
        let title = r['Job Title'] || '';

        let status = (r['Status'] || '').toLowerCase();

        let work = getWorkType(title).text;

        let allWorkButtons = document.querySelectorAll(
          '.mode-tool[data-group="work"]:not([data-value="all"])'
        );

        let allWorkValues = Array.from(allWorkButtons).map(
          (b) => b.dataset.value
        );

        let allStatusButtons = document.querySelectorAll(
          '.mode-tool[data-group="status"]:not([data-value="all"])'
        );

        let allStatusValues = Array.from(allStatusButtons).map(
          (b) => b.dataset.value
        );

        let isAllWorkSelected =
          allWorkValues.length > 0 &&
          allWorkValues.every((v) => workSubFilters.includes(v));

        let isAllStatusSelected =
          allStatusValues.length > 0 &&
          allStatusValues.every((v) => statusSubFilters.includes(v));

        // Work filter
        // ถ้า All Work ถูกเลือกครบ = ไม่กรอง Work
        if (workSubFilters.length > 0 && !isAllWorkSelected) {
          if (!workSubFilters.includes(work)) {
            return false;
          }
        }
        let networkGroup = getNetworkGroupValue(r);

let allNetworkButtons = document.querySelectorAll(
  '.mode-tool[data-group="network"]:not([data-value="all"])'
);

let allNetworkValues = Array.from(allNetworkButtons).map(
  (b) => b.dataset.value
);

let isAllNetworkSelected =
  allNetworkValues.length > 0 &&
  allNetworkValues.every((v) => networkGroupSubFilters.includes(v));

if (networkGroupSubFilters.length > 0 && !isAllNetworkSelected) {
  if (!networkGroupSubFilters.includes(networkGroup)) {
    return false;
  }
}
        // Status filter
        // ถ้า All Status ถูกเลือกครบ = ไม่กรอง Status
        if (statusSubFilters.length > 0 && !isAllStatusSelected) {
          let statusKey = getStatusFilterKey(status);

          let matchedStatus = statusSubFilters.some((filter) => {
            return statusKey === filter;
          });

          if (!matchedStatus) {
            return false;
          }
        }

        return true;
      }
      function getPrioritySortValue(pr) {
        pr = String(pr || 'NONE').toUpperCase();

        if (pr === 'CRITICAL') return 1;
        if (pr === 'MAJOR') return 2;
        if (pr === 'MINOR') return 3;

        return 4;
      }

      function togglePrioritySort() {
        if (prioritySortMode === 'none') {
          prioritySortMode = 'high';
        } else if (prioritySortMode === 'high') {
          prioritySortMode = 'low';
        } else {
          prioritySortMode = 'none';
        }

        render();
      }

      function getPrioritySortIcon() {
        if (prioritySortMode === 'high') return ' 🔽';
        if (prioritySortMode === 'low') return ' 🔼';
        return ' ↕';
      }
      function render() {
        let prov = $('#provinceFilter').val();
        let map = {},
          c = 0,
          m = 0,
          n = 0,
          o = 0;
        data.forEach((r) => {
          let pr = (mapCol(r, ['Priority']) || 'NONE').toUpperCase();
          let p = mapCol(r, ['Province Name']);
          let job = (mapCol(r, ['Job ID']) || '').toLowerCase();
          let title = (mapCol(r, ['Job Title']) || '').toLowerCase();
          let status = (mapCol(r, ['Status']) || '').toLowerCase();
          let assign = (mapCol(r, ['Assign to']) || '').toLowerCase();
          let province = (mapCol(r, ['Province Name']) || '').toLowerCase();
          let district = (mapCol(r, ['District Name']) || '').toLowerCase();
          let work = getWorkType(title).text.toLowerCase();
          let hr = getHr(r['Create Time']);
          let limit = pr === 'CRITICAL' ? 3 : pr === 'MAJOR' ? 10 : 1000;
          let od = hr > limit;
          let k = $('#search').val().toLowerCase().trim();
let keys = k ? k.split(/\s+/) : [];

let code = (PROV_CODE[p] || '').toLowerCase();

let text =
  job +
  ' ' +
  title +
  ' ' +
  status +
  ' ' +
  assign +
  ' ' +
  province +
  ' ' +
  district +
  ' ' +
  work +
  ' ' +
  code;

if (od) text += ' overdue';

for (let key of keys) {
  key = String(key || '').toLowerCase().trim();

  if (key === 'overdue' && !od) return;

  if (key !== 'overdue') {
    let groupKeys = TOP_SEARCH_GROUP_MAP[key];

    if (groupKeys) {
      let matchedGroup = groupKeys.some((g) => {
        return code === String(g || '').toLowerCase();
      });

      if (!matchedGroup) return;
    } else {
      if (!text.includes(key)) return;
    }
  }
}
          if (prov && p !== prov) return;
          if (!passToolSubFilter(r)) return;
          if (pr === 'CRITICAL') c++;
          else if (pr === 'MAJOR') m++;
          else n++;
          if (od) o++;
          if (!pass(pr, od)) return;
          if (!map[p]) map[p] = [];
          map[p].push({
            ...r,
            pr,
            hr,
            limit,
            od,
            district: r['District Name'],
            status: r['Status'],
            assign: r['Assign to'] || '-',
            work: getWorkType(title),
          });
        });
        $('#c').text('Critical:' + c);
        $('#m').text('Major:' + m);
        $('#n').text('Minor:' + n);
        $('#t').text('Total:' + (c + m + n));
        $('#o').text('Overdue:' + o);
        root.innerHTML =
          Object.keys(map)
            .map(
              (p) =>
                `<div class="card" id="${p}"><div class="card-header"><h3>📍 ${
                  PROV_CODE[p] ? `(${PROV_CODE[p]}) ` : ''
                }${p}</h3><button class="btn-export" onclick="exportJPG('${p}')"><span>📸</span><span>Export</span></button></div><table><tr><th>Job</th>
      <th onclick="togglePrioritySort()" class="sortable-th">
        Priority${getPrioritySortIcon()}
      </th>
      <th>Create</th><th>Work / Status</th><th>Title</th><th>Province</th><th>Assign</th><th>สถานะ SLA</th></tr>${[
        ...map[p],
      ]
        .sort((a, b) => {
          if (prioritySortMode === 'high') {
            return getPrioritySortValue(a.pr) - getPrioritySortValue(b.pr);
          }

          if (prioritySortMode === 'low') {
            return getPrioritySortValue(b.pr) - getPrioritySortValue(a.pr);
          }

          return 0;
        })
        .map(
          (r) =>
            `<tr class="${r.od ? 'overdue' : ''}"><td>${
              r['Job ID'] || ''
            }</td><td><div class="badge ${r.pr.toLowerCase()}">${
              r.pr
            }</div></td><td>${
              r['Create Time'] || ''
            }</td><td><div class="work work-${r.work.type}" style="display:${
              viewMode === 0 || viewMode === 2 ? 'inline-flex' : 'none'
            }">${r.work.icon} ${
              r.work.text
            }</div><div class="status-badge status-${
              getStatusInfo(r.status).cls
            }" style="display:${
              viewMode === 1 || viewMode === 2 ? 'inline-flex' : 'none'
            }">${getStatusInfo(r.status).icon} ${
              getStatusInfo(r.status).text
            }</div></td><td class="title-cell"><div class="title-text">${
              r['Job Title'] || ''
            }</div><span class="remark-btn ${
              r['Reason by WF'] ? 'has-remark' : ''
            }" onclick="showRemark('${
              r['Job ID']
            }')">ℹ️</span></td><td><div class="prov-name">${p}</div><div class="dist">${
              r.district || ''
            }</div></td><td><div class="assign-box">${r.assign}<td>${(() => {
              let s = getSLA(r.hr, r.limit);

              let remainText = r.od
                ? '<span class="sla-overdue-text">🔥 เกิน SLA 🔥</span>'
                : 'เหลือ: ' + formatTime(r.limit - r.hr);

              return `
          <div class="sla-box">
            <div class="sla-bar">
              <div class="sla-fill ${
                r.od ? 'sla-red' : s.color
              }" style="width:${s.pct}%"></div>
              <div class="sla-percent">${s.pct.toFixed(0)}%</div>
            </div>
            <div class="sla-text">ใช้ไป: ${formatTime(r.hr)}</div>
            <div class="sla-text">${remainText}</div>
          </div>
        `;
            })()}</td>
      </tr>`
        )
        .join('')}</table></div>`
            )
            .join('') || '<div class="no-data">❌ ไม่พบข้อมูล</div>';
      }
    </script>
  </body>
